# Production base file: the app service runs the image exactly as built, with no
# source bind-mount. Local-dev hot-reload lives in docker-compose.override.yml,
# which Compose loads automatically on `docker compose up` (and which production
# deployments exclude so the baked image is what actually runs).
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  # Optional Postgres for when DATABASE_URL is switched over from SQLite.
  # Unused while the app runs on the default sqlite:/// connection string.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice_to_action_points
      POSTGRES_PASSWORD: voice_to_action_points
      POSTGRES_DB: voice_to_action_points
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
